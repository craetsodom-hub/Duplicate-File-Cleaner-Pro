name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Restore
        run: dotnet restore DuplicateFileCleanerPro.sln --runtime win-x64
      - name: Build Release x64
        run: dotnet build DuplicateFileCleanerPro.sln --configuration Release -p:Platform=x64 --no-restore
      - name: Test Core
        run: dotnet test tests/DuplicateFileCleanerPro.Core.Tests/DuplicateFileCleanerPro.Core.Tests.csproj --configuration Release --no-build
